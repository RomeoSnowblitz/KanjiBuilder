<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanji Builder</title>
  <link rel="stylesheet" href="style.css" />
  <script src="translations.js"></script>
  <script defer src="symbols.js"></script>
  <script defer src="script.js"></script>
</head>
<body data-page="transfers">
  <header class="navbar">
    <nav>
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="create.html" data-i18n="nav.create">Create</a>
      <a href="dictionary.html" data-i18n="nav.dictionary">Dictionary</a>
      <a href="write.html" data-i18n="nav.write">Write</a>
      <a href="transfers.html" class="active" data-i18n="nav.transfers">Transfers</a>
      <a href="comments.html" data-i18n="nav.comments">Comments</a>
    </nav>
    <div class="navbar-right">
      <div class="lang-wrapper">
        <button type="button" id="lang-btn">English</button>
        <div id="lang-dropdown" class="lang-dropdown hidden">
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="es">Español</button>
          <button type="button" data-lang="fr">Français</button>
          <button type="button" data-lang="ru">Русский</button>
          <button type="button" data-lang="de">Deutsch</button>
          <button type="button" data-lang="ja">日本語</button>
        </div>
      </div>
      <button id="theme-toggle">🌙</button>
    </div>
  </header>
  <main>
    <span class="app-version">v0.3</span>
    <h1>Transfers</h1>

    <section class="transfer-card">
      <h2>Dictionary Export</h2>
      <input id="transfer-word-search" type="text" placeholder="Search words..." />
      <label><input id="transfer-full-dictionary" type="checkbox" /> Full Dictionary</label>
      <div id="transfer-word-list" class="transfer-list"></div>
      <div class="transfer-actions">
        <button id="transfer-export-dictionary">Export Dictionary</button>
        <input id="transfer-import-dictionary-file" type="file" accept=".txt,.json,.jsonl" />
        <button id="transfer-import-dictionary">Import Dictionary</button>
      </div>
    </section>

    <section class="transfer-card">
      <h2>Image Export</h2>
      <input id="transfer-image-search" type="text" placeholder="Search symbols..." />
      <label><input id="transfer-full-images" type="checkbox" /> Full Images</label>
      <label><input id="transfer-save-image-settings" type="checkbox" checked /> Save Image Settings</label>
      <p class="transfer-hint">Click a symbol to open image variants, then click variants to select them.</p>
      <div id="transfer-image-list" class="transfer-list"></div>
      <div class="transfer-actions">
        <button id="transfer-export-images">Export Images</button>
        <input id="transfer-import-images-file" type="file" accept=".json,.txt" />
        <button id="transfer-import-images">Import Images</button>
      </div>
    </section>

    <section class="transfer-card">
      <h2>Export All</h2>
      <button id="transfer-export-all">Export All</button>
    </section>

    <section class="transfer-card">
      <h2>Import Transfer File</h2>
      <p class="transfer-hint">Drop a transfer .json file here, or choose one manually.</p>
      <div id="transfer-dropzone" class="transfer-dropzone" tabindex="0">Drop .json here</div>
      <div class="transfer-actions">
        <input id="transfer-import-file" type="file" accept=".json" />
        <button id="transfer-import-file-btn">Import Transfer File</button>
      </div>
    </section>
  </main>
</body>
</html>
